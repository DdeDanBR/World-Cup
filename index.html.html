<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>Pixel Cup Soccer · Estádio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2a1a0e;--ink:#f6eed8;--dk:#3a2216;--pap:#e9d3a0;--gold:#f2c94c}

.sc{font-size:2.2em;font-weight:bold}.r{font-size:1.5em;color:var(--gold);text-shadow:.07em .07em var(--dk)}

button:hover{filter:brightness(1.1);transform:translateY(-.08em)}
</style></head>
<body><div id="w"><canvas id="c" width="480" height="270"></canvas><div id="ov"></div></div>
<script>
const C=document.getElementById('c'),g=C.getContext('2d'),ov=document.getElementById('ov'),wr=document.getElementById('w');
g.imageSmoothingEnabled=false;
const W=480,H=270,FW=960,FH=400,FX=100,FY=100,WW=FW+200,WH=FH+200,GC=FY+FH/2,GH=30,GZ=18,N=7,CHG=45;
const R=Math.random,H2=Math.hypot,cl=(v,a,b)=>v<a?a:v>b?b:v;
const T=[
{n:'BRASIL',a:'BRA',k:'#e6bf3c',K:'#e6bf3c',t:'#2f5a9e',o:'#f0e8d0',g:'#5a9a4a',fg:'#2f4a7e'},
{n:'ARGENTINA',a:'ARG',k:'#8ab8d8',K:'#ece6d4',t:'#2a2a3a',o:'#ece6d4',g:'#c8742e',fg:'#2a4258'},
{n:'ALEMANHA',a:'GER',k:'#e8e2d2',K:'#e8e2d2',t:'#2a2a2a',o:'#e8e2d2',g:'#7a5a8e',fg:'#2a2a2a'},
{n:'ITÁLIA',a:'ITA',k:'#3a64b0',K:'#3a64b0',t:'#ece6d4',o:'#3a64b0',g:'#4a4a58',fg:'#f6eed8'}];
const FORM=[[12,0],[130,-100],[130,100],[290,-135],[290,135],[440,-60],[440,60]];
let TM=[T[0],T[1]],P=[],ball,score=[0,0],tm=120,st='menu',stT=0,ctl,sc=null,shake=0,parts=[],keys={},chg=-1,ch=[null,null],frame=0,lastSc=0,msg='',msgT=0,cam={x:0,y:0},net=[{amp:0},{amp:0}];

/* ---------- SPRITES (matrizes 13x18: cabeçudos, brilho no cabelo, contorno marrom "sel-out") ---------- */
// x contorno, h/H cabelo+brilho, s/S pele+sombra, e olho, k/K/j camisa/listra/sombra, t calção, o meião, b bota, a braço/luva
const sh=(c,f)=>{const n=parseInt(c.slice(1),16);return '#'+[16,8,0].map(q=>Math.min(255,Math.round(((n>>q)&255)*f)).toString(16).padStart(2,'0')).join('')};
const HD=["...xxxxxxx...","..xhHHhhhhx..",".xhHhhhhhhhx.",".xhhhhhhhhhx."],BD=[".xkkkkkkkkkx.",".xakKkKkKkax.",".xakKkKkKkax.",".xajjjjjjjax.","..xtttttttx.."];
const TOR=[
HD.concat(["..xsssssssx..","..xsesssesx..","..xsesssesx..","...xSSSSSx..."],BD),
HD.concat(["..xhhhhhhhx..","..xhhhhhhhx..","..xhhHhhhhx..","...xhhhhhx..."],BD),
HD.concat(["..xhhsssssx..","..xhhsssesx..","..xhhsssesx..","...xhhsssx..."],["...xkkkkkx...","...xkKaKkx...","...xkKaKkx...","...xjjajjx...","...xtttttx..."])];
const LEG=[["...xtt.ttx...","...xoo.oox...","...xoo.oox...","...xbb.bbx...","...xxx.xxx..."],["...xtt.ttx...","..xoo...oox..","..xoo....ox..","..xbb....bx..","..xxx....xx.."]];
function build(p){const Q=TM[p.t],k=p.gk?Q.g:Q.k,pal={x:'#3a2216',h:p.hair,H:sh(p.hair,1.5),s:p.skin,S:sh(p.skin,.82),e:'#2a1a14',k,K:p.gk?Q.g:Q.K,j:sh(k,.78),t:Q.t,o:Q.o,b:'#4a2f1e',a:p.gk?'#f3ead0':p.skin};p.pal=pal;
p.spr=TOR.map(tr=>LEG.map(lg=>{const c=document.createElement('canvas');c.width=13;c.height=18;const x=c.getContext('2d');
tr.concat(lg).forEach((r,y)=>{for(let i=0;i<13;i++)if(r[i]!='.'){x.fillStyle=pal[r[i]];x.fillRect(i,y,1,1)}});return c}))}

/* ---------- ÁUDIO 8-bit ---------- */
let AC,master,NB;
function aud(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}if(AC.state=='suspended')AC.resume()}
function tone(f,d,ty='square',v=.2,f2=0,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(master);o.start(t);o.stop(t+d)}
function nz(d,v,fr,dl=0){if(!AC)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1}
const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;const n=AC.createGain(),t=AC.currentTime+dl;n.gain.setValueAtTime(.001,t);n.gain.linearRampToValueAtTime(v,t+Math.min(.08,d/3));n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(master);s.start(t);s.stop(t+d)}
const snd={
whistle(){tone(2300,.14,'square',.1,2400);tone(2100,.14,'square',.1,0,.16);tone(2400,.45,'square',.1,2300,.32)},
kick(){tone(200,.09,'sine',.5,60);nz(.05,.15,900)},
sup(){tone(120,.35,'sawtooth',.25,900);nz(.3,.2,1800)},
post(){tone(1300,.25,'triangle',.45,600);tone(650,.2,'square',.08,300)},
bounce(){tone(140,.06,'sine',.2,70)},
slide(){nz(.22,.18,500)},
save(){tone(320,.09,'square',.15,160)},
goal(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.14,0,i*.1));nz(2.4,.3,700);nz(2.4,.14,2500,.2)}};

/* ---------- CENÁRIO (pré-renderizado): vale rural ao entardecer ---------- */
const STC=['#b0452e','#2f5a9e','#d6a640','#e8e2d2','#4f7d34','#7a5a8e','#c8742e'],VH=['#3a2a20','#7a4a22','#d6a640','#a8442a','#8a8a8a'],VS=['#f2c09a','#cf9468','#9a6544'];
function person(q,x,fy,i,r,up){const c=STC[(i*7+r*3)%7],sk=VS[(i+r)%3];
q.fillStyle='#3a2216';q.fillRect(x-4,fy-13,9,13);q.fillStyle=c;q.fillRect(x-3,fy-7,7,7);q.fillStyle=sh(c,.78);q.fillRect(x-3,fy-2,7,2);
q.fillStyle=sk;q.fillRect(x-3,fy-12,7,5);q.fillStyle=VH[(i*5+r)%5];q.fillRect(x-3,fy-13,7,3);q.fillRect(x-4,fy-11,1,2);
q.fillStyle='#3a2216';q.fillRect(x-2,fy-9,1,1);q.fillRect(x+2,fy-9,1,1);
if(up){q.fillStyle=sk;q.fillRect(x-5,fy-14,1,6);q.fillRect(x+5,fy-14,1,6)}}
const bg=document.createElement('canvas');bg.width=WW;bg.height=WH;
(function(){const b=bg.getContext('2d');let s=11;const rn=()=>(s=s*16807%2147483647)/2147483647;
const disc=(cx,cy,r,c)=>{b.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));b.fillRect(cx-w,cy+y,2*w+1,1)}};
b.fillStyle='#5f8c3a';b.fillRect(0,0,WW,WH);
for(let i=0;i<9000;i++){b.fillStyle=rn()<.5?'#6a9a40':'#527f33';b.fillRect(rn()*WW|0,rn()*WH|0,2,1)}
for(let i=0;i<24;i++){b.fillStyle=i%2?'#80ae4e':'#74a444';b.fillRect(FX+i*40,FY,40,FH)}
b.globalAlpha=.28;for(let i=0;i<90;i++)disc(FX+rn()*FW|0,FY+rn()*FH|0,4+rn()*9|0,rn()<.5?'#a3c25c':'#5a8a38');
for(const[x,y,r]of[[FX+55,GC,42],[FX+FW-55,GC,42],[FX+FW/2,GC,22]])disc(x,y,r,'#9b8050');b.globalAlpha=1;
for(let i=0;i<1700;i++){const x=FX+rn()*FW|0,y=FY+rn()*FH|0;b.fillStyle='#4d7a32';b.fillRect(x,y,1,3);b.fillStyle='#98c45e';b.fillRect(x+1,y+1,1,2);b.fillStyle='#3d6a2a';b.fillRect(x-1,y+2,1,1)}
const box=(x,y,w,h)=>{b.fillRect(x,y,w,1);b.fillRect(x,y+h-1,w,1);b.fillRect(x,y,1,h);b.fillRect(x+w-1,y,1,h)};
const ring=(cx,cy,r)=>{for(let a=0;a<6.3;a+=1/r)b.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1)};
b.fillStyle='#f1ead0';box(FX,FY,FW,FH);b.fillRect(FX+FW/2,FY,1,FH);ring(FX+FW/2,GC,50);b.fillRect(FX+FW/2-1,GC-1,3,3);
box(FX,GC-100,100,200);box(FX+FW-100,GC-100,100,200);box(FX,GC-54,36,108);box(FX+FW-36,GC-54,36,108);
b.fillRect(FX+72,GC,2,2);b.fillRect(FX+FW-74,GC,2,2);
for(const[nx,sg]of[[FX-14,0],[FX+FW,1]]){b.fillStyle='#2e2a1c';b.fillRect(nx,GC-GH,14,GH*2);b.fillStyle='#efe4c0';
b.fillRect(nx,GC-GH-1,14,2);b.fillRect(nx,GC+GH-1,14,2);b.fillRect(sg?nx+13:nx,GC-GH-1,2,GH*2+2)}
b.fillStyle='#efe4c0';for(const px of[FX,FX+FW])for(const py of[GC-GH,GC+GH])b.fillRect(px-2,py-2,4,4);
// arquibancadas de concreto em degraus com público
const stand=(x0,y0,w,h,off)=>{b.fillStyle='#8a7a66';b.fillRect(x0,y0,w,h);
for(let t=0;t*15+15<=h;t++){const ty=y0+t*15;b.fillStyle='#b3a285';b.fillRect(x0,ty+12,w,1);b.fillStyle='#5e5142';b.fillRect(x0,ty+13,w,2);
for(let x=x0+4,i=0;x<x0+w-2;x+=7,i++)person(b,x,ty+12,i,t+off,false)}};
stand(0,0,WW,80,0);stand(0,520,WW,80,9);stand(0,84,56,436,20);stand(WW-56,84,56,436,30);
b.fillStyle='#4a3f33';b.fillRect(0,80,WW,3);b.fillRect(0,517,WW,3);b.fillRect(56,84,3,436);b.fillRect(WW-59,84,3,436);
// placas de publicidade
const ADN=['PIXEL COLA','8-BIT BANK','RETRO CUP','FAZENDA SOL','STAR-FRUIT','COIN-OP'],ADC=['#b0452e','#2f5a9e','#d6a640','#4f7d34','#7a5a8e','#c8742e'];
b.font='bold 8px "Courier New",monospace';b.textAlign='center';
const board=(y,o)=>{for(let i=0;i<13;i++){const x=FX-40+i*80,k=(i+o)%6;b.fillStyle='#3a2216';b.fillRect(x,y-1,80,13);b.fillStyle=ADC[k];b.fillRect(x+1,y,78,11);b.fillStyle='rgba(255,240,200,.25)';b.fillRect(x+1,y,78,1);b.fillStyle=k==2?'#3a2216':'#f6eed8';b.fillText(ADN[k],x+40,y+9)}};
board(FY-16,0);board(FY+FH+5,3);
for(let j=0;j<14;j++)for(const x of[FX-40,FX+FW+31]){b.fillStyle='#3a2216';b.fillRect(x,FY-16+j*40,9,41);b.fillStyle=ADC[j%6];b.fillRect(x+1,FY-15+j*40,7,39)}
// refletores no teto
b.fillStyle='#4a3f33';b.fillRect(0,0,WW,3);b.fillRect(0,WH-3,WW,3);
const lamp=(x,y)=>{b.globalAlpha=.16;disc(x,y+3,28,'#ffe9a0');b.globalAlpha=1;b.fillStyle='#3a3026';b.fillRect(x-16,y-2,32,10);b.fillStyle='#fff3c0';for(let k=0;k<8;k++){b.fillRect(x-14+k*4,y,3,3);b.fillRect(x-14+k*4,y+4,3,3)}};
for(let x=120;x<WW;x+=230){lamp(x,4);lamp(x,WH-12)}})();
// torcida animada do estádio (mesma grade da torcida estática; só colunas pares pulam)
function crowd(){const gl=st=='goal';
for(const[bot,y0]of[[0,12],[1,532]])for(let k=0;k<5;k++){const ti=bot?4-k:k,fy=y0+15*ti;if(fy<cam.y-2||fy-16>cam.y+H)continue;
for(let i=Math.max(0,(cam.x-8)/7|0);i<=Math.min(165,(cam.x+W+8)/7|0);i+=2){const ph=Math.sin(frame/(gl?3:8)+i*1.3+ti*.7),up=gl||ph>.6;
person(g,4+7*i,fy-(up?Math.round(Math.abs(ph)*(gl?3:1.5)):0),i,ti+(bot?9:0),up)}}}

/* ---------- JOGO ---------- */
function mk(){P=[];for(let t=0;t<2;t++)for(let i=0;i<N;i++){const ox=FORM[i][0],p={t,i,gk:i==0,hx:t?FX+FW-ox:FX+ox,hy:GC+FORM[i][1],x:0,y:0,vx:0,vy:0,fx:t?-1:1,fy:0,an:0,cool:0,slide:0,kick:0,dive:0,hold:0,cel:0,sx:0,sy:0,tx:0,ty:0,dd:1,
hair:['#3a2a20','#7a4a22','#d6a640','#a8442a'][(i+t*2)%4],skin:['#f2c09a','#cf9468','#9a6544'][(i*2+t)%3]};build(p);P.push(p)}}
function reset(kt){for(const p of P){p.x=p.hx;p.y=p.hy;p.vx=p.vy=0;p.slide=p.dive=p.cel=p.cool=p.kick=p.hold=0;p.fx=p.t?-1:1;p.fy=0}
const k=P[kt*N+5];k.x=FX+FW/2+(kt?16:-16);k.y=GC;
ball={x:FX+FW/2,y:GC,z:0,vx:0,vy:0,vz:0,o:null,lp:null,at:0,sup:0};ctl=P[5];chg=-1;st='kick';stT=70;sc=null;snd.whistle();
cam.x=cl(ball.x-W/2,0,WW-W);cam.y=cl(ball.y-H/2,0,WH-H)}
function setOwner(p){ball.o=p;ball.lp=p;ball.sup=0;ball.at=0;p.hold=0;if(p.t==0&&!p.gk){ctl=p;chg=-1}}
const LEAF=['#6f9f42','#4f7d34','#9bc45f','#b8a050','#8a6a3a'];
function dust(x,y,n=1){for(let i=0;i<n;i++)parts.push({x,y:y-1,vx:(R()-.5)*1.4,vy:-R()*1.1,l:18,c:LEAF[R()*5|0],gr:.07})}
function kick(p,dx,dy,pow,lift){ball.o=null;ball.lp=p;ball.sup=0;ball.at=0;ball.x=p.x+dx*6;ball.y=p.y+dy*6;ball.vx=dx*pow+p.vx*.3;ball.vy=dy*pow+p.vy*.3;ball.vz=lift;p.cool=25;p.kick=10;snd.kick();dust(p.x,p.y,3,'#5fc247')}
function passTo(p,q){const d=H2(q.x-p.x,q.y-p.y),ax=q.x+q.vx*d/4-p.x,ay=q.y+q.vy*d/4-p.y,dd=H2(ax,ay)||1;kick(p,ax/dd,ay/dd,cl(d/38+.6,2,8),0);if(p===ctl)ctl=q}
function humanPass(p){let best=null,bs=1e9;for(const q of P)if(q.t==0&&q!==p&&!q.gk){const dx=q.x-p.x,dy=q.y-p.y,d=H2(dx,dy)||1,dot=(dx*p.fx+dy*p.fy)/d;if(dot>.3&&d<420){const s=d*(2.2-dot);if(s<bs){bs=s;best=q}}}
best?passTo(p,best):kick(p,p.fx,p.fy,3.5,0)}
function shoot(p,c){let dx=p.fx,dy=p.fy;const gx=FX+FW,c1=c/CHG,sup=c1>=.85;
if(Math.abs(gx-p.x)<360&&dx>.3){const ty=GC+(R()-.5)*50,ax=gx-p.x,ay=ty-p.y,d=H2(ax,ay);dx=dx*.5+ax/d*.5;dy=dy*.5+ay/d*.5;const n=H2(dx,dy);dx/=n;dy/=n}
kick(p,dx,dy,sup?11.5:4+c1*6,sup?1.3:.6+c1*2.2);ball.at=30;ball.sup=sup?1:0;if(sup){snd.sup();shake=4}}
function slide(p,tx,ty){if(p.gk||p.cool>0||p.slide||p.dive)return;p.slide=22;p.cool=55;
if(tx!==undefined){const d=H2(tx-p.x,ty-p.y)||1;p.sx=(tx-p.x)/d;p.sy=(ty-p.y)/d}else{p.sx=p.fx;p.sy=p.fy}snd.slide()}
function foul(q,o){snd.whistle();msg='FALTA!';msgT=80;q.slide=0;q.cool=120;q.vx=q.vy=0;st='kick';stT=60;if(o.t==0&&!o.gk)ctl=o;chg=-1}
function mv(p,tx,ty,sp){const dx=tx-p.x,dy=ty-p.y,d=H2(dx,dy);let ax=0,ay=0;if(d>2){const s=Math.min(sp,d*.25+.2);ax=dx/d*s;ay=dy/d*s}p.vx+=(ax-p.vx)*.3;p.vy+=(ay-p.vy)*.3}
function human(p){const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0),n=H2(dx,dy)||1,mx=dx||dy;
mv(p,mx?p.x+dx/n*60:p.x,mx?p.y+dy/n*60:p.y,(ball.o===p?1.55:1.7)*(chg>0?.6:1))}
function keeper(p){const t=p.t,dir=t?-1:1,lx=t?FX+FW-10:FX+10,b=ball;
if(b.o===p){if(++p.hold>70){const q=P.filter(q=>q.t==t&&!q.gk),r=q[R()*q.length|0],d=H2(r.x-p.x,r.y-p.y)||1;kick(p,(r.x-p.x)/d,(r.y-p.y)/d,cl(d/38+.6,3,7),1.5)}p.vx*=.8;p.vy*=.8;return}
if(!b.o&&p.cool<=0&&(t?b.vx>2:b.vx<-2)&&Math.abs(b.x-lx)<150){const tt=(lx-b.x)/b.vx;if(tt>0&&tt<36){const py=b.y+b.vy*tt;if(Math.abs(py-GC)<GH+8&&b.z<22){p.dive=34;p.tx=lx;p.ty=cl(py,GC-GH-4,GC+GH+4);p.dd=py>p.y?1:-1;return}}}
mv(p,lx+dir*(Math.abs(b.x-lx)<160?14:0),GC+cl((b.y-GC)*.45,-GH+5,GH-5),1.8)}
function ai(p){if(p.gk)return keeper(p);
const t=p.t,dir=t?-1:1,gx=t?FX:FX+FW,o=ball.o,b=ball;
if(o===p){p.hold++;const dg=H2(gx-p.x,GC-p.y);let near=null,nd=1e9;
for(const q of P)if(q.t!=t&&!q.gk){const d=H2(q.x-p.x,q.y-p.y);if(d<nd){nd=d;near=q}}
if(dg<250&&p.hold>14&&R()<.1){const ty=GC+(R()-.5)*50,ax=gx-p.x,ay=ty-p.y,d=H2(ax,ay);kick(p,ax/d,ay/d,6+R()*3,.5+R()*1.4);return}
if(nd<30&&p.hold>20&&R()<.05){const c=P.filter(q=>q.t==t&&q!==p&&!q.gk&&dir*(q.x-p.x)>-20);if(c.length){passTo(p,c[R()*c.length|0]);return}}
let ty=GC+(p.y-GC)*.5;if(near&&nd<55)ty=p.y+(p.y>=near.y?1:-1)*50;
mv(p,p.x+dir*80,cl(ty,FY+10,FY+FH-6),1.35);return}
if(ch[t]===p){const tx=o?o.x:b.x+b.vx*8,ty=o?o.y:b.y+b.vy*8;mv(p,tx,ty,1.45);
if(o&&o.t!=t&&p.cool<=0&&H2(o.x-p.x,o.y-p.y)<20&&R()<.02)slide(p,o.x,o.y);return}

if(!o.gk&&st=='play')for(const q of P)if(q.t!=o.t&&!q.gk&&H2(q.x-o.x,q.y-o.y)<10){
if(q.slide>0){if((q.sx*o.fx+q.sy*o.fy)>.55&&R()<.7)foul(q,o);else if(R()<.65){setOwner(q);o.cool=40}else{b.o=null;b.vx=q.sx*3;b.vy=q.sy*3;o.cool=30}break}
else if(q.cool<=0&&R()<.02){setOwner(q);o.cool=30;break}}
return}

if(b.sup){if(H2(b.vx,b.vy)>2.5){for(let i=0;i<2;i++)parts.push({x:b.x+(R()-.5)*3,y:b.y-b.z-2+(R()-.5)*3,vx:(R()-.5)*.5,vy:(R()-.5)*.5,l:16,c:['#f3c75a','#fbe9a8','#e0a040','#8aa84a'][R()*4|0],gr:0})}else b.sup=0}
b.x+=b.vx;b.y+=b.vy;
if(b.z>0||b.vz>0){b.vz-=.16;b.z+=b.vz;if(b.z<=0){b.z=0;if(b.vz<-1.2){b.vz*=-.5;snd.bounce()}else b.vz=0}}
const f=b.z>0?.997:.978;b.vx*=f;b.vy*=f;
for(const px of[FX,FX+FW])for(const py of[GC-GH,GC+GH]){const dx=b.x-px,dy=b.y-py,d=H2(dx,dy);
if(d<4&&d>0&&b.z<GZ+3){const nx=dx/d,ny=dy/d,dn=b.vx*nx+b.vy*ny;if(dn<0){b.vx-=1.9*dn*nx;b.vy-=1.9*dn*ny;b.x=px+nx*4.2;b.y=py+ny*4.2;if(H2(b.vx,b.vy)>1){snd.post();shake=3}}}}
const inM=Math.abs(b.y-GC)<GH;
if(st=='goal'){b.x=cl(b.x,FX-12,FX+FW+12);if(b.x<FX||b.x>FX+FW)b.y=cl(b.y,GC-GH+2,GC+GH-2);if(b.x<=FX-12||b.x>=FX+FW+12)b.vx*=-.3;b.vx*=.95;b.vy*=.95}
else{
if(b.y<FY){b.y=FY;b.vy=Math.abs(b.vy)*.7}if(b.y>FY+FH){b.y=FY+FH;b.vy=-Math.abs(b.vy)*.7}
for(const s of[0,1]){const gx=s?FX+FW:FX,out=s?b.x>gx:b.x<gx;if(!out)continue;
if(inM&&b.z<GZ){goal(s?0:1);return}
b.x=gx;if(inM&&b.z<GZ+4){b.vx*=-.5;b.vz=Math.abs(b.vz)*.3;snd.post();shake=3}else b.vx*=-.6}}
if(st=='play'){let bp=null,bd=99;
for(const p of P){if(p.cool>0||p.slide)continue;if(b.z>(p.gk?18:7))continue;const rc=p.gk?(p.dive?17:12):8,d=H2(b.x-p.x,b.y-p.y);if(d<rc&&d<bd){bd=d;bp=p}}
if(bp){const sp=H2(b.vx,b.vy);
if(bp.gk){if(sp>4.6&&R()<.4){b.vx*=-.5;b.vy=(R()-.5)*3;b.vz=1.2;b.sup=0;bp.cool=30;snd.save();shake=2}else{setOwner(bp);snd.save()}}
else if(sp>5&&R()<.5)bp.cool=10;else setOwner(bp)}}}

p.an+=sp}

stepBall()}
