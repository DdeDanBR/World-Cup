<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Cup Soccer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2a1a0e;--ink:#f6eed8;--dk:#3a2216;--pap:#e9d3a0;--gold:#f2c94c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1209}}
:root[data-theme="dark"]{--bg:#1f1209}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;overflow:hidden}
#w{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;text-align:center;background:linear-gradient(rgba(255,170,80,.16),rgba(40,20,8,.4)),repeating-linear-gradient(0deg,#7b4f26 0 2.4em,#5d3a1c 2.4em 2.55em)}
h1{margin:0;font-size:3.2em;line-height:1;color:var(--gold);text-shadow:.07em .07em var(--dk),.14em .14em rgba(0,0,0,.35)}
.k,.sc{background:var(--pap);color:#4a2c17;border:.2em solid var(--dk);box-shadow:inset 0 0 0 .18em #b57a3c;padding:.5em 1.2em}
.k{font-size:1.02em;line-height:1.7;max-width:46em}.k b{color:#9a3a22}
.tm{display:flex;gap:.8em}
.sc{font-size:2.2em;font-weight:bold}.r{font-size:1.5em;color:var(--gold);text-shadow:.07em .07em var(--dk)}
button{font:bold 1.25em "Courier New",monospace;padding:.5em 1em;background:var(--pap);color:#4a2c17;border:.18em solid var(--dk);box-shadow:inset 0 0 0 .16em #b57a3c,0 .2em var(--dk);cursor:pointer}
button:hover{filter:brightness(1.1);transform:translateY(-.08em)}
</style></head>
<body><div id="w"><canvas id="c" width="480" height="270"></canvas><div id="ov"></div></div>
<script>
const C=document.getElementById('c'),g=C.getContext('2d'),ov=document.getElementById('ov'),wr=document.getElementById('w');
g.imageSmoothingEnabled=false;
const W=480,H=270,FW=1200,FH=520,FX=60,FY=60,WW=FW+120,WH=FH+120,GC=FY+FH/2,GH=34,GZ=18,N=11,CHG=45,HALF=180;
const R=Math.random,H2=Math.hypot,cl=(v,a,b)=>v<a?a:v>b?b:v;
const T=[
{n:'BRASIL',a:'BRA',k:'#e6bf3c',K:'#e6bf3c',t:'#2f5a9e',o:'#f0e8d0',g:'#5a9a4a',fg:'#2f4a7e'},
{n:'ARGENTINA',a:'ARG',k:'#8ab8d8',K:'#ece6d4',t:'#2a2a3a',o:'#ece6d4',g:'#c8742e',fg:'#2a4258'},
{n:'ALEMANHA',a:'GER',k:'#e8e2d2',K:'#e8e2d2',t:'#2a2a2a',o:'#e8e2d2',g:'#7a5a8e',fg:'#2a2a2a'},
{n:'ITÁLIA',a:'ITA',k:'#3a64b0',K:'#3a64b0',t:'#ece6d4',o:'#3a64b0',g:'#4a4a58',fg:'#f6eed8'}];
const FORM=[[12,0],[150,-195],[150,-65],[150,65],[150,195],[360,-150],[360,0],[360,150],[540,-170],[540,0],[540,170]]; // GK, 4 defensores, 3 meias, 3 atacantes
let TM=[T[0],T[1]],P=[],ball,score=[0,0],tm=HALF,half=1,SP=null,ramp=1,chgK='z',st='menu',stT=0,ctl,sc=null,shake=0,parts=[],keys={},chg=-1,ch=[null,null],frame=0,lastSc=0,msg='',msgT=0,cam={x:0,y:0},net=[{amp:0},{amp:0}];

/* ---------- SPRITES (matrizes 13x18: cabeçudos, brilho no cabelo, contorno marrom "sel-out") ---------- */
// x contorno, h/H cabelo+brilho, s/S pele+sombra, e olho, k/K/j camisa/listra/sombra, t calção, o meião, b bota, a braço/luva
const sh=(c,f)=>{const n=parseInt(c.slice(1),16);return '#'+[16,8,0].map(q=>Math.min(255,Math.round(((n>>q)&255)*f)).toString(16).padStart(2,'0')).join('')};
const HD=["...xxxxxxx...","..xhHHhhhhx..",".xhHhhhhhhhx.",".xhhhhhhhhhx."],BD=[".xkkkkkkkkkx.",".xakKkKkKkax.",".xakKkKkKkax.",".xajjjjjjjax.","..xtttttttx.."];
const TOR=[
HD.concat(["..xsssssssx..","..xsesssesx..","..xsesssesx..","...xSSSSSx..."],BD),
HD.concat(["..xhhhhhhhx..","..xhhhhhhhx..","..xhhHhhhhx..","...xhhhhhx..."],BD),
HD.concat(["..xhhsssssx..","..xhhsssesx..","..xhhsssesx..","...xhhsssx..."],["...xkkkkkx...","...xkKaKkx...","...xkKaKkx...","...xjjajjx...","...xtttttx..."])];
const LEG=[["...xtt.ttx...","...xoo.oox...","...xoo.oox...","...xbb.bbx...","...xxx.xxx..."],["...xtt.ttx...","..xoo...oox..","..xoo....ox..","..xbb....bx..","..xxx....xx.."]];
const ar=r=>'k'+r+'k',GL=['gg'+'.'.repeat(11)+'gg','xx'+'.'.repeat(11)+'xx'];
// pulo do goleiro (vertical): pernas, calção, camisa, cabeça, braços esticados com luvas
const DA=["....xxx.xxx....","....xbx.xbx....","....xox.xox....","....xox.xox....","...xtttttttx...","...xjjjjjjjx...","..xkkkkkkkkkx..",ar(".xkkkkkkkkkx.")];
const DV=[DA.concat(TOR[0].slice(0,8).map(ar),GL),GL.slice().reverse().concat(TOR[1].slice(0,8).map(ar),DA.slice().reverse())];
// carrinho: [lateral (18x14), para baixo, para cima]
const SL=[[
"...xxxxxxx........","..xhHHhhhhx.......",".xhHhhhhhhhx......",".xhhhhhhhhhx......","..xhhsssssx.......","..xhhsssesx.......","..xhhsssesx.......","...xhhsssx........",
"...xkkkkkkx.......","..xakKkKkxtttx....","..xaajjjjxttttx...","...xxxxx.xoooooobb","........xooooxxxxx","........xxxxxx...."],
TOR[0].slice(0,8).concat([".xkkkkkkkkkx.","xaxkKkKkKkxax","xaxjjjjjjjxax","..xtttttttx..","..xttx.xttx..","..xoox.xoox..","..xoox.xoox..",".xbbbx.xbbbx.",".xxxxx.xxxxx."]),
[".xxxxx.xxxxx.",".xbbbx.xbbbx.","..xoox.xoox..","..xoox.xoox..","..xttx.xttx..","..xtttttttx..","xaxjjjjjjjxax","xaxkKkKkKkxax",".xkkkkkkkkkx."].concat(TOR[1].slice(0,8).reverse())];
function mkc(rows,pal){const w=Math.max(...rows.map(r=>r.length)),c=document.createElement('canvas');c.width=w;c.height=rows.length;const x=c.getContext('2d');
rows.forEach((r,y)=>{for(let i=0;i<r.length;i++)if(r[i]!='.'){x.fillStyle=pal[r[i]];x.fillRect(i,y,1,1)}});return c}
function build(p){const Q=TM[p.t],k=p.gk?Q.g:Q.k,pal={x:'#3a2216',h:p.hair,H:sh(p.hair,1.5),s:p.skin,S:sh(p.skin,.82),e:'#2a1a14',k,K:p.gk?Q.g:Q.K,j:sh(k,.78),t:Q.t,o:Q.o,b:'#4a2f1e',a:p.gk?'#f3ead0':p.skin,g:'#f3ead0'};p.pal=pal;
p.spr=TOR.map(tr=>LEG.map(lg=>mkc(tr.concat(lg),pal)));p.sl=SL.map(r=>mkc(r,pal));if(p.gk)p.dv=DV.map(r=>mkc(r,pal))}

/* ---------- ÁUDIO 8-bit ---------- */
let AC,master,NB;
function aud(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}if(AC.state=='suspended')AC.resume()}
function tone(f,d,ty='square',v=.2,f2=0,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(master);o.start(t);o.stop(t+d)}
function nz(d,v,fr,dl=0){if(!AC)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1}
const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fr;const n=AC.createGain(),t=AC.currentTime+dl;n.gain.setValueAtTime(.001,t);n.gain.linearRampToValueAtTime(v,t+Math.min(.08,d/3));n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(master);s.start(t);s.stop(t+d)}
const snd={
whistle(){tone(2300,.14,'square',.1,2400);tone(2100,.14,'square',.1,0,.16);tone(2400,.45,'square',.1,2300,.32)},
kick(){tone(200,.09,'sine',.5,60);nz(.05,.15,900)},
sup(){tone(120,.35,'sawtooth',.25,900);nz(.3,.2,1800)},
post(){tone(1300,.25,'triangle',.45,600);tone(650,.2,'square',.08,300)},
bounce(){tone(140,.06,'sine',.2,70)},
slide(){nz(.22,.18,500)},
save(){tone(320,.09,'square',.15,160)},
goal(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.14,0,i*.1));nz(2.4,.3,700);nz(2.4,.14,2500,.2)}};

/* ---------- CENÁRIO: gramado simples ---------- */
const bg=document.createElement('canvas');bg.width=WW;bg.height=WH;
(function(){const b=bg.getContext('2d');
b.fillStyle='#5f8c3a';b.fillRect(0,0,WW,WH);
for(let i=0;i<FW/50;i++){b.fillStyle=i%2?'#80ae4e':'#74a444';b.fillRect(FX+i*50,FY,50,FH)}
const box=(x,y,w,h)=>{b.fillRect(x,y,w,1);b.fillRect(x,y+h-1,w,1);b.fillRect(x,y,1,h);b.fillRect(x+w-1,y,1,h)};
const ring=(cx,cy,r)=>{for(let a=0;a<6.3;a+=1/r)b.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1)};
b.fillStyle='#f1ead0';box(FX,FY,FW,FH);b.fillRect(FX+FW/2,FY,1,FH);ring(FX+FW/2,GC,60);b.fillRect(FX+FW/2-1,GC-1,3,3);
box(FX,GC-130,120,260);box(FX+FW-120,GC-130,120,260);box(FX,GC-68,44,136);box(FX+FW-44,GC-68,44,136);
b.fillRect(FX+84,GC,2,2);b.fillRect(FX+FW-86,GC,2,2);
for(const[nx,sg]of[[FX-14,0],[FX+FW,1]]){b.fillStyle='#2e2a1c';b.fillRect(nx,GC-GH,14,GH*2);b.fillStyle='#efe4c0';
b.fillRect(nx,GC-GH-1,14,2);b.fillRect(nx,GC+GH-1,14,2);b.fillRect(sg?nx+13:nx,GC-GH-1,2,GH*2+2)}
b.fillStyle='#efe4c0';for(const px of[FX,FX+FW])for(const py of[GC-GH,GC+GH])b.fillRect(px-2,py-2,4,4);for(const[cx,cy]of[[FX,FY],[FX+FW,FY],[FX,FY+FH],[FX+FW,FY+FH]]){b.fillStyle='#f1ead0';b.fillRect(cx,cy-10,1,10);b.fillStyle='#d8584a';b.fillRect(cx+1,cy-10,5,3)}})();

/* ---------- JOGO ---------- */
function mk(){P=[];for(let t=0;t<2;t++)for(let i=0;i<N;i++){const ox=FORM[i][0],p={t,i,gk:i==0,hx:t?FX+FW-ox:FX+ox,hy:GC+FORM[i][1],x:0,y:0,vx:0,vy:0,fx:t?-1:1,fy:0,an:0,cool:0,slide:0,kick:0,dive:0,hold:0,cel:0,sx:0,sy:0,tx:0,ty:0,dd:1,
hair:['#3a2a20','#7a4a22','#d6a640','#a8442a'][(i+t*2)%4],skin:['#f2c09a','#cf9468','#9a6544'][(i*2+t)%3]};build(p);P.push(p)}}
function reset(kt){for(const p of P){p.x=p.hx;p.y=p.hy;p.vx=p.vy=0;p.slide=p.dive=p.cel=p.cool=p.kick=p.hold=0;p.fx=p.t?-1:1;p.fy=0}
const k=P[kt*N+9];k.x=FX+FW/2+(kt?16:-16);k.y=GC;
ball={x:FX+FW/2,y:GC,z:0,vx:0,vy:0,vz:0,o:null,lp:null,at:0,sup:0};ctl=P[9];chg=-1;st='kick';stT=70;sc=null;snd.whistle();
cam.x=cl(ball.x-W/2,0,WW-W);cam.y=cl(ball.y-H/2,0,WH-H)}
function setOwner(p){ball.o=p;ball.lp=p;ball.sup=0;ball.at=0;p.hold=0;if(p.t==0&&!p.gk){ctl=p;chg=-1}}
const LEAF=['#6f9f42','#4f7d34','#9bc45f','#b8a050','#8a6a3a'];
function dust(x,y,n=1){for(let i=0;i<n;i++)parts.push({x,y:y-1,vx:(R()-.5)*1.4,vy:-R()*1.1,l:18,c:LEAF[R()*5|0],gr:.07})}
function kick(p,dx,dy,pow,lift){ball.err=(R()-.5)*80;ball.rx=R()<.7;ball.o=null;ball.lp=p;ball.sup=0;ball.at=0;ball.x=p.x+dx*6;ball.y=p.y+dy*6;ball.vx=dx*pow+p.vx*.3;ball.vy=dy*pow+p.vy*.3;ball.vz=lift;p.cool=25;p.kick=10;snd.kick();dust(p.x,p.y,3,'#5fc247')}
function passTo(p,q,hi){const d=H2(q.x-p.x,q.y-p.y),ax=q.x+q.vx*d/4-p.x,ay=q.y+q.vy*d/4-p.y,dd=H2(ax,ay)||1;
if(hi){const l=cl(d/160+1,1.1,2.6);kick(p,ax/dd,ay/dd,cl(dd/(l*12.5*1.05),2,9),l)}else kick(p,ax/dd,ay/dd,cl(d/38+.6,2,8),0);if(p===ctl)ctl=q}
function humanPass(p,hi){let best=null,bs=1e9;for(const q of P)if(q.t==0&&q!==p&&!q.gk){const dx=q.x-p.x,dy=q.y-p.y,d=H2(dx,dy)||1,dot=(dx*p.fx+dy*p.fy)/d;if(dot>.3&&d<520){const s=d*(2.2-dot);if(s<bs){bs=s;best=q}}}
best?passTo(p,best,hi):kick(p,p.fx,p.fy,hi?4:3.5,hi?1.5:0)}
function shoot(p,c,hi){let dx=p.fx,dy=p.fy;const gx=FX+FW,c1=c/CHG,sup=c1>=.85;
if(Math.abs(gx-p.x)<440&&dx>.3){const ty=GC+(R()-.5)*50,ax=gx-p.x,ay=ty-p.y,d=H2(ax,ay);dx=dx*.5+ax/d*.5;dy=dy*.5+ay/d*.5;const n=H2(dx,dy);dx/=n;dy/=n}
kick(p,dx,dy,sup?(hi?10.5:12):hi?3.8+c1*5.5:4.5+c1*6,sup?(hi?2.2:.25):hi?1.2+c1*1.6:0);ball.at=30;ball.sup=sup?1:0;if(sup){snd.sup();shake=4}}
function slide(p,tx,ty){if(p.gk||p.cool>0||p.slide||p.dive)return;p.slide=22;p.cool=55;
if(tx!==undefined){const d=H2(tx-p.x,ty-p.y)||1;p.sx=(tx-p.x)/d;p.sy=(ty-p.y)/d}else{p.sx=p.fx;p.sy=p.fy}snd.slide()}
function foul(q,o){snd.whistle();q.slide=0;q.cool=120;q.vx=q.vy=0;const own=q.t?FX+FW:FX;
if(Math.abs(o.x-own)<120&&Math.abs(o.y-GC)<130)setPiece('pen',o.t,o.t?FX+84:FX+FW-86,GC);else setPiece('free',o.t,o.x,o.y)}
function mv(p,tx,ty,sp){const dx=tx-p.x,dy=ty-p.y,d=H2(dx,dy);let ax=0,ay=0;if(d>2){const s=Math.min(sp*ramp,d*.25+.2);ax=dx/d*s;ay=dy/d*s}p.vx+=(ax-p.vx)*.3;p.vy+=(ay-p.vy)*.3}
function human(p){const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0),n=H2(dx,dy)||1,mx=dx||dy;
mv(p,mx?p.x+dx/n*60:p.x,mx?p.y+dy/n*60:p.y,(ball.o===p?1.55:1.7)*(chg>0?.6:1))}
function keeper(p){const t=p.t,dir=t?-1:1,lx=t?FX+FW-10:FX+10,b=ball;
if(b.o===p){if(++p.hold>70){const q=P.filter(q=>q.t==t&&!q.gk),r=q[R()*q.length|0],d=H2(r.x-p.x,r.y-p.y)||1;kick(p,(r.x-p.x)/d,(r.y-p.y)/d,cl(d/38+.6,3,7),1.5)}p.vx*=.8;p.vy*=.8;return}
if(!b.o&&p.cool<=0&&b.rx!==false&&(t?b.vx>2:b.vx<-2)&&Math.abs(b.x-lx)<130){const tt=(lx-b.x)/b.vx;if(tt>0&&tt<28){const py=b.y+b.vy*tt+(b.err||0); // reação tardia, às vezes nem reage, erra a leitura
if(Math.abs(py-GC)<GH+8&&b.z<22){p.dive=34;p.tx=lx;p.ty=cl(py,GC-GH-4,GC+GH+4);p.dd=py>p.y?1:-1;return}}}
mv(p,lx+dir*(Math.abs(b.x-lx)<160?14:0),GC+cl((b.y-GC)*.38,-GH+5,GH-5),1.2)}
function ai(p){if(p.gk)return keeper(p);
const t=p.t,dir=t?-1:1,gx=t?FX:FX+FW,o=ball.o,b=ball;
if(o===p){p.hold++;const dg=H2(gx-p.x,GC-p.y);let near=null,nd=1e9;
for(const q of P)if(q.t!=t&&!q.gk){const d=H2(q.x-p.x,q.y-p.y);if(d<nd){nd=d;near=q}}
if(dg<310&&p.hold>14&&R()<.1){const ty=GC+(R()-.5)*50,ax=gx-p.x,ay=ty-p.y,d=H2(ax,ay);kick(p,ax/d,ay/d,6+R()*3,.5+R()*1.4);return}
if(nd<30&&p.hold>20&&R()<.05){const c=P.filter(q=>q.t==t&&q!==p&&!q.gk&&dir*(q.x-p.x)>-20);if(c.length){passTo(p,c[R()*c.length|0],R()<.25);return}}
let ty=GC+(p.y-GC)*.5;if(near&&nd<55)ty=p.y+(p.y>=near.y?1:-1)*50;
mv(p,p.x+dir*80,cl(ty,FY+10,FY+FH-6),1.35);return}
if(ch[t]===p){const tx=o?o.x:b.x+b.vx*8,ty=o?o.y:b.y+b.vy*8;mv(p,tx,ty,1.45);
if(o&&o.t!=t&&p.cool<=0&&H2(o.x-p.x,o.y-p.y)<20&&R()<.02)slide(p,o.x,o.y);return}
const has=o&&o.t==t;let tx=p.hx+(b.x-FX-FW/2)*(has?.75:.5);if(has&&p.i>4)tx+=dir*50;
if(p.i<5)tx=t?Math.max(tx,FX+FW*.42):Math.min(tx,FX+FW*.58);
mv(p,cl(tx,FX+12,FX+FW-12),p.hy+(b.y-GC)*.3,1.2)}

function goal(team){score[team]++;lastSc=team;st='goal';stT=200;shake=12;snd.goal();ball.o=null;
const lp=ball.lp;sc=lp&&lp.t==team&&!lp.gk?lp:P[team*N+9];
for(const p of P)p.cel=p.t==team&&!p.gk?1:0;net[team?0:1].amp=9;
const cc=['#e8a33a','#d8584a','#f2c94c','#8aa84a','#f3ead0','#d98aa0'];
for(let i=0;i<140;i++)parts.push({x:cam.x+R()*W,y:cam.y-10+R()*34,vx:(R()-.5)*3,vy:R()*1.5,l:120+R()*80|0,c:cc[R()*6|0],gr:.04})}

function stepBall(){const b=ball;
if(b.o){const o=b.o,off=o.gk?0:7;b.x+=(o.x+o.fx*off-b.x)*.5;b.y+=(o.y+o.fy*off-b.y)*.5;b.z=0;b.vx=o.vx;b.vy=o.vy;b.vz=0;
if(st=='play'&&!o.gk){const inM=Math.abs(b.y-GC)<GH;b.lp=o;
if(b.y<FY||b.y>FY+FH){outLine();return}
if(b.x<FX||b.x>FX+FW){const e=b.x<FX?0:1;if(inM){goal(e?0:1);return}outEnd(e);return}}
if(!o.gk&&st=='play')for(const q of P)if(q.t!=o.t&&!q.gk&&H2(q.x-o.x,q.y-o.y)<10){
if(q.slide>0){if((q.sx*o.fx+q.sy*o.fy)>.55&&R()<.7)foul(q,o);else if(R()<.65){setOwner(q);o.cool=40}else{b.o=null;b.vx=q.sx*3;b.vy=q.sy*3;o.cool=30}break}
else if(q.cool<=0&&R()<.02){setOwner(q);o.cool=30;break}}
return}
if(b.at>0){b.at--;b.vy+=((keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0))*.09}

/* ============ BOLA PARADA: lateral, tiro de meta, escanteio, falta e pênalti ============
   Máquina de estados: 'play' (bola em jogo) -> 'sp' (bola parada) -> 'play'
   SP.phase: 'setup' (jogadores correm p/ as posições; cobrança bloqueada) -> 'ready' (mira + força, ou CPU cobra) */
const SPN={throw:'LATERAL',goalkick:'TIRO DE META',corner:'ESCANTEIO',free:'FALTA',pen:'PÊNALTI'};
function outLine(){const b=ball,lp=b.lp?b.lp.t:0;setPiece('throw',1-lp,cl(b.x,FX+25,FX+FW-25),b.y<FY?FY+1:FY+FH-1)}
function outEnd(e){const b=ball,lp=b.lp?b.lp.t:0; // e: 0 = fundo esquerdo (gol do azul), 1 = direito
if(lp==e)setPiece('corner',1-e,e?FX+FW-4:FX+4,b.y<GC?FY+4:FY+FH-4);else setPiece('goalkick',e,e?FX+FW-30:FX+30,GC)}
function setPiece(type,team,x,y){
ball.o=null;ball.vx=ball.vy=ball.vz=0;ball.z=0;ball.sup=0;ball.at=0;
x=cl(x,FX+4,FX+FW-4);y=cl(y,FY+1,FY+FH-1);ball.x=x;ball.y=y;
for(const p of P){p.slide=p.dive=p.cel=0;p.hold=0;p.vx*=.3;p.vy*=.3}
const mine=P.filter(p=>p.t==team),dT=team?-1:1,gx=team?FX:FX+FW;let tk=null;
if(type=='goalkick')tk=mine[0];else if(type=='pen')tk=mine[9];else{let bd=1e9;for(const p of mine)if(!p.gk){const d=H2(p.x-x,p.y-y);if(d<bd){bd=d;tk=p}}}
let ax=dT,ay=0;
if(type=='throw'){ax=dT*.5;ay=y<GC?.85:-.85}else if(type=='corner'){ax=gx-dT*86-x;ay=GC-y}else if(type=='free'||type=='pen'){ax=gx-x;ay=GC-y}
const m=H2(ax,ay)||1;
SP={type,team,x,y,taker:tk,phase:'setup',t:0,timer:600,wait:0,ax:ax/m,ay:ay/m};
if(team==0)ctl=tk;
assignSP();st='sp';chg=-1;ramp=1;msg=SPN[type];msgT=70}
function assignSP(){const q=SP,type=q.type,team=q.team,x=q.x,y=q.y,tk=q.taker,dT=team?-1:1,gx=team?FX:FX+FW,top=y<GC,sg=top?1:-1,
cx=v=>cl(v,FX+10,FX+FW-10),cy=v=>cl(v,FY+8,FY+FH-4),set=(p,a,b)=>{p.qx=cx(a);p.qy=cy(b)};
for(const p of P){if(p.gk)set(p,p.hx,GC+cl((y-GC)*.4,-20,20));else set(p,p.hx+(x-FX-FW/2)*.55,p.hy+(y-GC)*.35)}
const mates=P.filter(p=>p.t==team&&p!==tk&&!p.gk),foes=P.filter(p=>p.t!=team&&!p.gk);
const near=(a,px,py)=>a.slice().sort((m,n)=>H2(m.qx-px,m.qy-py)-H2(n.qx-px,n.qy-py));
if(type=='throw'){tk.qx=x;tk.qy=top?y+8:y-8;near(mates,x,y).slice(0,3).forEach((m,k)=>set(m,x+[-75,75,0][k],y+sg*[50,70,105][k]))}
else if(type=='goalkick'){tk.qx=x-dT*12;tk.qy=y;mates.forEach(m=>set(m,m.qx+dT*90,m.qy));
const edge=(team?FX+FW:FX)+dT*136; // oponentes fora da grande área
foes.forEach(f=>{if(dT>0?f.qx<edge:f.qx>edge)set(f,edge,f.qy)})}
else if(type=='corner'){tk.qx=x+(x<FX+FW/2?8:-8);tk.qy=y+(top?8:-8);
mates.slice().sort((a,b)=>b.i-a.i).slice(0,4).forEach((m,k)=>set(m,gx-dT*(60+k*20),GC+(k-1.5)*45));
foes.slice().sort((a,b)=>a.i-b.i).slice(0,5).forEach((f,k)=>set(f,gx-dT*(48+k*18),GC+(k-2)*38+10))}
else if(type=='free'){tk.qx=x-dT*12;tk.qy=y;const gd=H2(gx-x,GC-y);
if(gd>140){const u0=(gx-x)/gd,u1=(GC-y)/gd; // barreira a 100 px da bola, em linha com o gol
near(foes,x,y).slice(0,4).forEach((f,k)=>set(f,x+u0*100-u1*(k-1.5)*13,y+u1*100+u0*(k-1.5)*13))}
near(mates,gx-dT*100,GC).slice(0,3).forEach((m,k)=>set(m,gx-dT*(70+k*25),GC+(k-1)*60))}
else if(type=='pen'){tk.qx=x-dT*16;tk.qy=y;
P.filter(p=>p!==tk&&!p.gk).forEach((p,k)=>set(p,gx-dT*(190+(k%2)*16),GC+((k>>1)-4.5)*26)); // fora da área e do arco
set(P.find(p=>p.gk&&p.t!=team),gx-dT*10,GC)}
const D={throw:45,free:100,corner:100}[type];
if(D)foes.forEach(f=>{const dx=f.qx-x,dy=f.qy-y,d=H2(dx,dy);if(d<D-2){const u=d?[dx/d,dy/d]:[0,1];set(f,x+u[0]*D,y+u[1]*D)}})}
function spStep(){const q=SP;q.t++;
ball.x=q.x;ball.y=q.y;ball.z=0;ball.vx=ball.vy=ball.vz=0;
let ok=true;
for(const p of P){if(p.cool>0)p.cool--;if(p.kick>0)p.kick--;
if(q.phase=='setup'){const d=H2(p.qx-p.x,p.qy-p.y);if(d>3){ok=false;mv(p,p.qx,p.qy,4.2)}else{p.vx*=.5;p.vy*=.5}}else{p.vx*=.5;p.vy*=.5}
const v=H2(p.vx,p.vy);
if(p.gk){p.fx=p.t?-1:1;p.fy=0}else if(v>.3){p.fx+=(p.vx/v-p.fx)*.35;p.fy+=(p.vy/v-p.fy)*.35;const n=H2(p.fx,p.fy)||1;p.fx/=n;p.fy/=n}
p.an+=v;p.x=cl(p.x+p.vx,FX+3,FX+FW-3);p.y=cl(p.y+p.vy,FY+2,FY+FH)}
if(q.phase=='setup'){
if(ok||q.t>120){if(!ok)for(const p of P){p.x=p.qx;p.y=p.qy;p.vx=p.vy=0}
q.phase='ready';q.timer=600;q.wait=40+(R()*60|0);chg=-1;if(q.type=='pen'||q.type=='free')snd.whistle()}
return}
const tk=q.taker;tk.fx=q.ax;tk.fy=q.ay;
if(q.team==0){
const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
if(dx||dy){const n=H2(dx,dy);q.ax+=(dx/n-q.ax)*.12;q.ay+=(dy/n-q.ay)*.12;const m=H2(q.ax,q.ay)||1;q.ax/=m;q.ay/=m}
if(q.type=='throw'){const e=q.y<GC?1:-1;q.ay=e*Math.max(q.ay*e,.25)}else if(q.type=='corner'){const e=q.x<FX+FW/2?1:-1;q.ax=e*Math.max(q.ax*e,.2)}
{const m=H2(q.ax,q.ay)||1;q.ax/=m;q.ay/=m}
if(chg>=0&&keys[chgK])chg=Math.min(CHG,chg+1)}
else if(--q.wait<=0)cpuSP();
if(st=='sp'&&--q.timer<=0)spTimeout()}
function spKick(dx,dy,pow,lift){const q=SP,t=q.taker;ball.err=(R()-.5)*80;ball.rx=R()<.7;ball.o=null;ball.lp=t;ball.sup=0;ball.at=0;ball.x=q.x;ball.y=q.y;ball.z=0;
ball.vx=dx*pow;ball.vy=dy*pow;ball.vz=lift;t.cool=25;t.kick=10;snd.kick();dust(t.x,t.y,3);
st='play';ramp=.15;chg=-1} // volta ao jogo: jogadores aceleram suavemente (ramp)
function spKey(k){if(SP.phase!='ready'||SP.team!=0)return;if(k=='z'||k=='x'){chg=0;chgK=k}if(k=='c'||k=='v')spPass(k=='v')}
function spUp(k){if(SP.phase=='ready'&&SP.team==0&&chg>=0)spShoot(Math.max(chg,6),k=='x')}
function spShoot(c,hi){const q=SP,ty=q.type,c1=c/CHG,sup=c1>=.85&&(ty=='free'||ty=='pen');let pow,lift;
if(ty=='throw'){pow=2.4+c1*3.8;lift=hi?.8+c1:.15}else if(ty=='goalkick'){pow=4+c1*6;lift=hi?1.1+c1*1.7:.1}else if(ty=='corner'){pow=3.8+c1*5;lift=hi?1.4+c1*2:.4}

function spPass(hi){const q=SP;let best=null,bs=1e9;
for(const m of P)if(m.t==q.team&&m!==q.taker&&!m.gk){const dx=m.x-q.x,dy=m.y-q.y,d=H2(dx,dy)||1,dot=(dx*q.ax+dy*q.ay)/d;if(dot>.3&&d<520){const v=d*(2.2-dot);if(v<bs){bs=v;best=m}}}
if(!best)return;const d=H2(best.x-q.x,best.y-q.y)||1,ux=(best.x-q.x)/d,uy=(best.y-q.y)/d;
if(hi){const l=cl(d/160+1,1.1,2.6);spKick(ux,uy,cl(d/(l*12.5*1.05),2,9),l)}else spKick(ux,uy,cl(d/38+.6,2,8),{throw:.2,goalkick:.1,corner:.3}[q.type]||0);ctl=best}
function cpuSP(){const q=SP,T=q.team,dT=T?-1:1,gx=T?FX:FX+FW,mates=P.filter(p=>p.t==T&&p!==q.taker&&!p.gk);
const go=(tx,ty,pow,lift)=>{const d=H2(tx-q.x,ty-q.y)||1;spKick((tx-q.x)/d,(ty-q.y)/d,pow,lift)};
const pass=(m,lift)=>{const d=H2(m.x-q.x,m.y-q.y);go(m.x,m.y,cl(d/38+.6,2.2,8),lift)};
const ord=mates.slice().sort((a,b)=>H2(a.x-q.x,a.y-q.y)-H2(b.x-q.x,b.y-q.y));

else if(q.type=='goalkick'){const m=mates.filter(p=>p.i>=5),t=m[R()*m.length|0],d=H2(t.x-q.x,t.y-q.y);go(t.x,t.y,cl(d/30+1,4,9),1.5)}
else if(q.type=='corner'){const tx=gx-dT*(60+R()*30),ty=GC+(R()-.5)*90,d=H2(tx-q.x,ty-q.y);go(tx,ty,cl(d/28+1,4.5,8.5),1.9)}

function spTimeout(){const o=SP,t2=1-o.team,dEnd=t2?FX+FW-30:FX+30; // tempo esgotado: inverte a posse

if(chg>=0&&keys[chgK])chg=Math.min(CHG,chg+1)}
